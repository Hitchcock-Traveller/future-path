<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — 页面不存在 · 低空智联</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    background: #F8F6F0;
    color: #1D2733;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    text-align: center;
    max-width: 480px;
  }
  .code {
    font-size: 96px;
    font-weight: 800;
    background: linear-gradient(135deg, #1E3A5F, #2978B5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
    font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 12px;
    color: #1D2733;
  }
  p {
    font-size: 15px;
    line-height: 1.8;
    color: #4A5568;
    margin-bottom: 28px;
  }
  a {
    display: inline-block;
    padding: 12px 32px;
    background: #1E3A5F;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: "Source Han Sans SC", "Noto Sans SC", sans-serif;
    transition: all 0.2s;
  }
  a:hover { background: #2978B5; transform: translateY(-1px); }
  .divider {
    width: 48px;
    height: 2px;
    background: #D4A853;
    margin: 20px auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="divider"></div>
    <h1>页面走丢了</h1>
    <p>你要找的页面可能已经被移动、重命名，或者从来没有存在过。</p>
    <a href="./">回到首页 →</a>
  </div>
</body>
</html>
