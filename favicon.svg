<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#2978B5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 无人机+地形图标的 -->
  <g transform="translate(32 30)">
    <!-- 等高线 -->
    <ellipse cx="0" cy="8" rx="20" ry="5" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="5" rx="15" ry="4" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="0" cy="2" rx="10" ry="3" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="-1" rx="5" ry="2" fill="none" stroke="#D4A853" stroke-width="1.5" opacity="0.9"/>
    <!-- 无人机俯视 -->
    <ellipse cx="0" cy="-12" rx="14" ry="4" fill="#fff" opacity="0.9"/>
    <circle cx="-12" cy="-14" r="4" fill="#1E3A5F" stroke="#D4A853" stroke-width="1"/>
    <circle cx="12" cy="-14" r="4" fill="#1E3A5F" stroke="#D4A853" stroke-width="1"/>
    <circle cx="-12" cy="-14" r="2" fill="#D4A853"/>
    <circle cx="12" cy="-14" r="2" fill="#D4A853"/>
    <rect x="-2" y="-13" width="4" height="6" rx="1" fill="#fff"/>
  </g>
</svg>
